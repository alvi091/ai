# Cloud Build — builds both images into Artifact Registry.
# Run from repo root:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_TAG=latest .
#
# Reusable substitutions: _REGION (GCP region), _TAG (image tag).
# Project id comes from the active gcloud project ($PROJECT_ID).

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ayymus/ayymus-api:${_TAG}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/worker/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ayymus/ayymus-worker:${_TAG}'
      - '.'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ayymus/ayymus-api:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/ayymus/ayymus-worker:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
