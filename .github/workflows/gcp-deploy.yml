name: Deploy to GCP Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: pelagic-cycle-472614-h5
  REGION: asia-south1
  REPO: ayymus
  REGISTRY: asia-south1-docker.pkg.dev/pelagic-cycle-472614-h5/ayymus
  CLOUD_SQL_INSTANCE: pelagic-cycle-472614-h5:asia-south1:ayymus-db
  VPC_CONNECTOR: ayymus-vpc-connector
  # Secret Manager ids — rename here if your secrets use different names.
  SECRET_DATABASE_URL: DATABASE_URL
  SECRET_JWT_SECRET: JWT_SECRET
  SECRET_GEMINI_API_KEY: GEMINI_API_KEY
  SECRET_REDIS_URL: REDIS_URL
  SECRET_CLOUD_TASKS_QUEUE: CLOUD_TASKS_QUEUE
  SECRET_CLOUD_TASKS_WORKER_URL: CLOUD_TASKS_WORKER_URL
  SECRET_CLOUD_TASKS_OIDC_SA: CLOUD_TASKS_OIDC_SA

jobs:
  build-and-deploy:
    name: Build images and deploy Cloud Run services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_format: json
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push images (Artifact Registry)
        run: |
          gcloud builds submit --config=cloudbuild.yaml \
            --substitutions=_REGION=${{ env.REGION }},_TAG=${{ github.sha }} .

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ayymus-api \
            --region ${{ env.REGION }} \
            --image ${{ env.REGISTRY }}/ayymus-api:${{ github.sha }} \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --vpc-connector ${{ env.VPC_CONNECTOR }} \
            --vpc-egress private-ranges-only \
            --cpu 2 --memory 2Gi --min-instances 1 --max-instances 4 \
            --service-account ayymus-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars "NODE_ENV=production,ANALYZE_QUEUE_ENABLED=true,ANALYZE_INLINE_MAX=2,ANALYSIS_CACHE_TTL_MS=43200000,RATE_LIMIT_WINDOW_MS=900000,RATE_LIMIT_MAX=3000,FLIPKART_MAX_REVIEWS=60,MYNTRA_MAX_REVIEWS=60,CORS_ORIGIN=https://ayymus.com" \
            --update-secrets "DATABASE_URL=${{ env.SECRET_DATABASE_URL }},JWT_SECRET=${{ env.SECRET_JWT_SECRET }},GEMINI_API_KEY=${{ env.SECRET_GEMINI_API_KEY }},REDIS_URL=${{ env.SECRET_REDIS_URL }},CLOUD_TASKS_QUEUE=${{ env.SECRET_CLOUD_TASKS_QUEUE }},CLOUD_TASKS_WORKER_URL=${{ env.SECRET_CLOUD_TASKS_WORKER_URL }},CLOUD_TASKS_OIDC_SA=${{ env.SECRET_CLOUD_TASKS_OIDC_SA }}"

      - name: Deploy Worker to Cloud Run (private)
        run: |
          gcloud run deploy ayymus-worker \
            --region ${{ env.REGION }} \
            --image ${{ env.REGISTRY }}/ayymus-worker:${{ github.sha }} \
            --no-allow-unauthenticated \
            --add-cloudsql-instances ${{ env.CLOUD_SQL_INSTANCE }} \
            --vpc-connector ${{ env.VPC_CONNECTOR }} \
            --vpc-egress private-ranges-only \
            --cpu 2 --memory 4Gi --concurrency 4 --max-instances 3 \
            --set-env-vars "NODE_ENV=production,ANALYZE_WORKER_CONCURRENCY=3,ANALYZE_GLOBAL_MAX=6,ANALYSIS_CACHE_TTL_MS=43200000,FLIPKART_MAX_REVIEWS=60,MYNTRA_MAX_REVIEWS=60,AMAZON_MAX_REVIEWS=0,AJIO_MAX_REVIEWS=0,NYKAA_MAX_REVIEWS=0,MEESHO_MAX_REVIEWS=0" \
            --set-secrets "DATABASE_URL=${{ env.SECRET_DATABASE_URL }},GEMINI_API_KEY=${{ env.SECRET_GEMINI_API_KEY }},REDIS_URL=${{ env.SECRET_REDIS_URL }}"

      # Cloud Tasks pushes with an OIDC token from this SA -> must be able to invoke the worker
      - name: Let the API invoke the worker
        run: |
          gcloud run services add-iam-policy-binding ayymus-worker \
            --region ${{ env.REGION }} \
            --member="serviceAccount:ayymus-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            --role="roles/run.invoker"
