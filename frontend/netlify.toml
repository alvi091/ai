[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api to the Cloud Run backend — same-origin, no CORS needed.
# Rules are matched top-to-bottom; keep this above the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://ayymus-api-1005268354682.asia-south1.run.app/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
