# Render Blueprint — Ayymus deployment.
#
# Provisions four things off the same repository:
#   1. WEB      — Express API + the built frontend SPA (enqueues URL analyses)
#   2. WORKER   — drains the URL-analysis queue (crawl + Playwright + Gemini)
#   3. REDIS    — Key Value instance (BullMQ queue + shared rate-limit store)
#   4. Postgres — external (Supabase). Not created here.
#
# HOW TO DEPLOY
#   1. Push this repo to GitHub.
#   2. Render -> New -> Blueprint Instance -> pick the repo (it auto-reads render.yaml).
#   3. Fill the `sync: false` secrets in the dashboard during creation:
#      DATABASE_URL (Supabase), GEMINI_API_KEY, RAPIDAPI_KEY, CORS_ORIGIN,
#      SMTP_HOST, SMTP_USER, SMTP_PASS, WEB_UNLOCKER_KEY, SERP_API_KEY.
#   4. Postgres is Supabase (external). Run once against it:
#        npx prisma db push && npm run prisma:seed
#      (Migrations aren't used yet - schema.prisma is db-push managed.)
#   5. Load test, read "cache-hit / fresh" log lines, scale WORKER instances from
#      the dashboard slider when needed. No code changes required to scale.
#
# Instance plans below use `standard` as a safe baseline. Bump RAM/CPU per
# store via the dashboard (WEB 1-2 GB; WORKER 2-4 GB) after first deploy.
# Free tier CANNOT do this reliably (browser + 24/7 load) - use paid plans.

services:
  # ---------- Redis (Render Key Value) ----------
  - type: keyvalue
    name: redis
    plan: starter
    ipAllowList: [] # Internal connections only (api + worker connect privately)
    maxmemoryPolicy: noeviction # Never silently drop queued jobs
    persistenceMode: journal-snapshot

  # ---------- API + frontend ----------
  - type: web
    name: ayymus-api
    runtime: node
    rootDir: backend
    plan: standard
    buildCommand: >-
      npm ci --include=dev &&
      npx prisma generate &&
      npx prisma db push --skip-generate &&
      cd ../frontend && npm ci --include=dev && npm run build
    # Schema is db-push managed. Run ONCE after first deploy against Supabase:
    #   npx prisma db push && npm run prisma:seed
    # (keeping it here would slow every boot and crash-loop while the DB is down)
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Secrets - set in the dashboard once (NOT in the repo):
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: real-time-amazon-data.p.rapidapi.com
      - key: RAPIDAPI_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - key: ANALYZE_QUEUE_ENABLED
        value: "true"
      - key: ANALYZE_INLINE_MAX
        value: "2"
      - key: ANALYSIS_CACHE_TTL_MS
        value: "43200000"
      # Per-IP burst budget: 3000 req / 15 min (~5-8 req/s sustained). /api/health
      # is exempted in code, so Render's monitor never burns user budget.
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "3000"
      # Bright Data Web Unlocker
      - key: WEB_UNLOCKER_KEY
        sync: false
      - key: WEB_UNLOCKER_ZONE
        value: ayymus
      # Bright Data SERP API
      - key: SERP_API_KEY
        sync: false
      - key: SERP_API_ZONE
        value: serp_api1

  # ---------- Background worker ----------
  - type: worker
    name: ayymus-worker
    runtime: node
    rootDir: backend
    plan: standard
    buildCommand: >-
      npm ci --include=dev &&
      npx prisma generate
    # Chromium is installed at RUNTIME (not build): Render's persistent disk is
    # only mounted at runtime, and `playwright install --with-deps` needs root
    # (build user can't `su`). Browsers persist on the disk between deploys.
    startCommand: >-
      npx playwright install chromium &&
      node src/worker.js
    disk:
      name: playwright-cache
      mountPath: /opt/playwright-cache
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/playwright-cache
      - key: PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: real-time-amazon-data.p.rapidapi.com
      - key: RAPIDAPI_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      # Concurrency per worker instance (crawl + browsers are memory heavy).
      - key: ANALYZE_WORKER_CONCURRENCY
        value: "3"
      # Best-effort cap on ACTIVE analyses across ALL worker instances.
      - key: ANALYZE_GLOBAL_MAX
        value: "16"
      - key: ANALYSIS_CACHE_TTL_MS
        value: "43200000"
      # Deep review slates - 0 = fetch ALL written comments.
      # Capped for speed — 0 = fetch ALL (can take 30+ min on Flipkart due to 5s pacing).
      # Set to positive number (e.g. 60) to limit reviews fetched.
      - key: FLIPKART_MAX_REVIEWS
        value: "60"
      # Capped for speed — 0 = fetch ALL (Myntra API pagination).
      - key: MYNTRA_MAX_REVIEWS
        value: "60"
      - key: AMAZON_MAX_REVIEWS
        value: "0"
      - key: AJIO_MAX_REVIEWS
        value: "0"
      - key: NYKAA_MAX_REVIEWS
        value: "0"
      - key: MEESHO_MAX_REVIEWS
        value: "0"
      # Bright Data Web Unlocker
      - key: WEB_UNLOCKER_KEY
        sync: false
      - key: WEB_UNLOCKER_ZONE
        value: ayymus
      # Bright Data SERP API
      - key: SERP_API_KEY
        sync: false
      - key: SERP_API_ZONE
        value: serp_api1